<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title id="pageTitle">Товар — СЫТЫЙ ПАПИК</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/phoneCopy.css">
  <style>
    /* Стили для фиксированного хедера */
    .site-header {
      background: rgba(11, 11, 12, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* Отступ для контента под фиксированным хедером */
    body {
      padding-top: 80px;
    }

    .product-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 24px;
    }

    .product-layout {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .product-image {
      flex: 0 0 450px;
    }

    .product-image img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .product-info {
      flex: 1;
    }

    .product-info h1 {
      font-size: 32px;
      margin: 0 0 16px 0;
      color: #fff;
    }

    .product-desc {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .product-price {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      margin: 24px 0;
    }

    .product-sizes {
      margin: 24px 0;
    }

    .product-sizes label {
      display: block;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      font-size: 16px;
    }

    .size-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .size-button {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .size-button:hover {
      background: rgba(255, 159, 28, 0.1);
      border-color: rgba(255, 159, 28, 0.3);
    }

    .size-button.active {
      background: rgba(255, 159, 28, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .product-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn-back {
      padding: 14px 24px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.2);
    }

    .btn-add-to-cart {
      padding: 14px 32px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #111;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add-to-cart:hover {
      background: var(--accent-2);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(255,122,24,0.4);
    }

    .btn-add-to-cart:active {
      transform: translateY(0);
    }

    .product-category {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(255,122,24,0.1);
      border: 1px solid rgba(255,122,24,0.2);
      border-radius: 6px;
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .not-found {
      text-align: center;
      padding: 80px 24px;
    }

    .not-found h1 {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .not-found p {
      color: var(--muted);
      margin-bottom: 32px;
    }

    @media (max-width: 900px) {
      .product-layout {
        flex-direction: column;
      }

      .product-image {
        flex: 1 1 auto;
        width: 100%;
      }

      .product-info h1 {
        font-size: 24px;
      }

      .product-price {
        font-size: 24px;
      }

      .product-actions {
        flex-direction: column;
      }

      .btn-back,
      .btn-add-to-cart {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<div id="copyToast" class="copy-toast">
  Номер скопирован
</div>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <a href="index.html"><img src="images/logo-placeholder.png" alt="СЫТЫЙ ПАПИК" class="logo-img"></a>
      </div>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="menu.html" class="nav-link">Меню</a>
        <a href="delivery.html" class="nav-link">Доставка / Контакты</a>
        <a href="cart.html" class="nav-link">Корзина</a>
      </nav>
      <button class="burger" id="burger" aria-label="Открыть меню">☰</button>
    </div>
  </header>

  <main id="productMain">
    <!-- Контент загружается через JS -->
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>СЫТЫЙ ПАПИК</strong>
        <p>Адрес: <span class="placeholder">Мариуполь, Проспект Металлургов, 64</span></p>
         <p>
  Телефон:
  <span class="phone-copy" data-phone="+79494546304">
    +7 (949) 454-63-04
  </span>
</p>

<p>
  Доп. Телефон:
  <span class="phone-copy" data-phone="+79497374186" href="#">
    +7 (949) 737-41-86
  </span>
</p>
      </div>
      <div>
        <p>Соцсети / мессенджеры:</p>
        <ul class="socials">
          <li><a href="https://www.instagram.com/sitipapik/" class="placeholder-link">Instagram</a></li>
          <li><a href="https://t.me/sitipapik" class="placeholder-link">Telegram</a></li>
          <li><a href="https://vk.com/sitipapik" class="placeholder-link">Вконтакте</a></li>
          <li><a href="https://ok.ru/group/70000040995384" class="placeholder-link">Одноклассники</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="js/menu-cards.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Получаем ID товара из URL
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    // Словарь категорий для отображения
    const categoryNames = {
      'shawarma': 'Шаурма',
      'bludo': 'Блюда',
      'panini': 'Панини',
      'drinks': 'Напитки'
    };

    // Находим товар в массиве
    const product = MENU_ITEMS.find(item => item.id === productId);

    if (product) {
      // Обновляем title страницы
      document.getElementById('pageTitle').textContent = `${product.title} — СЫТЫЙ ПАПИК`;

      // Формируем HTML товара
      const categoryLabel = categoryNames[product.category] || 'Другое';
      
      // Определяем, есть ли размеры
      let sizeSelector = '';
      let selectedPrice = product.price;
      let selectedSize = null;
      
      if (product.sizes && product.sizes.length > 1) {
        selectedPrice = product.sizes[0].price;
        selectedSize = product.sizes[0].name;
        
        sizeSelector = `
          <div class="product-sizes">
            <label>Выберите размер:</label>
            <div class="size-buttons">
              ${product.sizes.map((size, index) => `
                <button class="size-button ${index === 0 ? 'active' : ''}" 
                        data-price="${size.price}" 
                        data-size="${size.name}"
                        onclick="selectSize(this, ${size.price}, '${size.name}')">
                  ${size.name} — ${size.price} ₽
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } else if (product.sizes && product.sizes.length === 1) {
        selectedPrice = product.sizes[0].price;
        selectedSize = product.sizes[0].name;
      }

      // --- ЛОГИКА СТАРОЙ ЦЕНЫ ---
      // Показываем старую цену только если она есть в MENU_ITEMS
      const oldPriceHtml = product.noneDiscount 
        ? `<span class="price-old-detail">${product.noneDiscount} ₽</span>` 
        : '';
      // --------------------------
      
      document.getElementById('productMain').innerHTML = `
        <div class="product-container">
          <div class="product-layout">
            <div class="product-image">
              <img src="${product.img}" alt="${product.title}">
            </div>
            <div class="product-info">
              <span class="product-category">${categoryLabel}</span>
              <h1>${product.title}</h1>
              <p class="product-desc">${product.desc}</p>
              ${sizeSelector}
              
              <div class="price-container">
                ${oldPriceHtml}
                <div class="product-price" id="currentPrice">${selectedPrice} ₽</div>
              </div>

              <div class="product-actions">
                <a href="menu.html" class="btn-back">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0L0 8l8 8V0z"/>
                  </svg>
                  Назад к меню
                </a>
                <button class="btn-add-to-cart" onclick="addProductToCart()">
                  Добавить в корзину
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
      
      // Сохраняем данные для добавления в корзину
      window.currentProduct = {
        ...product,
        selectedPrice: selectedPrice,
        selectedSize: selectedSize
      };
    }
    else {
      // Товар не найден
      document.getElementById('productMain').innerHTML = `
        <div class="not-found">
          <h1>404</h1>
          <p>Товар не найден</p>
          <a href="menu.html" class="btn-back">Вернуться в меню</a>
        </div>
      `;
    }

    // Функция выбора размера
    function selectSize(button, price, sizeName) {
      // Обновляем активную кнопку
      document.querySelectorAll('.size-button').forEach(btn => {
        btn.classList.remove('active');
      });
      button.classList.add('active');
      
      // Обновляем цену
      document.getElementById('currentPrice').textContent = price + ' ₽';
      
      // Сохраняем выбранные данные
      window.currentProduct.selectedPrice = price;
      window.currentProduct.selectedSize = sizeName;
    }

    // Функция добавления в корзину
    function addProductToCart() {
      if (!product) return;

      addToCart(
        window.currentProduct.id, 
        window.currentProduct.title, 
        window.currentProduct.selectedPrice, 
        window.currentProduct.img,
        window.currentProduct.selectedSize
      );

      const btn = document.querySelector('.btn-add-to-cart');
      const originalText = btn.textContent;
      
      btn.textContent = '✓ Добавлено в корзину';
      btn.style.background = '#28a745';
      
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = '';
      }, 1500);
    }
  </script>
  <script src="js/script.js"></script>
  <script src="js/phoneCopy.js"></script>
</body>
</html>
